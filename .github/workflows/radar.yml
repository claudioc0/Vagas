name: Radar de Vagas (Go Engine)

on:
  schedule:
    # A cada 15 minutos em minutos deslocados (evita filas globais do GitHub Actions)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar-vagas
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: vagas-go/go.sum

      - name: Executar Radar de Vagas (Go)
        working-directory: vagas-go
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          go run ./cmd/vagas scan --db ../vagas.db --report ../busca/radar_vagas_recomendadas.md

      - name: Persistir Atualizações no Repositório
        if: always()
        run: |
          git config --global user.name "Radar Bot"
          git config --global user.email "bot@radar-vagas.local"
          git add busca/ vagas.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(radar): atualiza radar de vagas via Go Engine [skip ci]" && git push)

      - name: Keepalive Workflow
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/radar.yml/enable" || true
